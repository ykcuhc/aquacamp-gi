      for(let i=0;i<9;i++){ const x=c.x+(rnd()-.5)*(c.sx-4), z=c.z+(rnd()-.5)*(c.sz-4); const ring=new THREE.Mesh(new THREE.TorusGeometry(.78,.24,8,20),M({color:'#111'}));
        ring.rotation.x=Math.PI/2; ring.position.set(x,.32,z); root.add(ring); cyl(.7,.76,.45,M({color:inflCols[i%6],metalness:.3,roughness:.35}),x,.42,z,18); person(x,z); } } break;
    case 'inf_soccer': { const along=c.sx>=c.sz; plane(c.sx,c.sz,M({color:'#2d6a4f'}),c.x,.08,c.z);
      const lineM=new THREE.MeshBasicMaterial({color:'#ffffff'}); plane(along?.14:c.sx-1.4, along?c.sz-1.4:.14, lineM, c.x,.1,c.z);
      const cc=new THREE.Mesh(new THREE.RingGeometry(1.4,1.56,32),lineM); cc.rotation.x=-Math.PI/2; cc.position.set(c.x,.1,c.z); root.add(cc);
      const wall=(x,z,lx,lz,col)=>box(lx,1.8,lz,M({color:col,roughness:.45}),x,.9,z);
      wall(c.x,c.z-c.sz/2,c.sx,.7,'#e63946'); wall(c.x,c.z+c.sz/2,c.sx,.7,'#e63946'); wall(c.x-c.sx/2,c.z,.7,c.sz,'#1d3557'); wall(c.x+c.sx/2,c.z,.7,c.sz,'#1d3557');
      const gm=M({color:'#ffffff'});
      for(const s2 of [-1,1]){ if(along){ const gx=c.x+s2*(c.sx/2-1.0); cyl(.08,.08,2,gm,gx,1,c.z-1.5,8); cyl(.08,.08,2,gm,gx,1,c.z+1.5,8); box(.12,.12,3.1,gm,gx,2,c.z); }
        else { const gz=c.z+s2*(c.sz/2-1.0); cyl(.08,.08,2,gm,c.x-1.5,1,gz,8); cyl(.08,.08,2,gm,c.x+1.5,1,gz,8); box(3.1,.12,.12,gm,c.x,2,gz); } }
      for(let i=0;i<8;i++){ const x=c.x+(rnd()-.5)*(c.sx-3), z=c.z+(rnd()-.5)*(c.sz-2.5); person(x,z);
        const b=new THREE.Mesh(new THREE.SphereGeometry(.85,16,12),M({color:'#ffffff',transparent:true,opacity:.42,roughness:.05})); b.position.set(x,1.0,z); root.add(b); }
      const ball=new THREE.Mesh(new THREE.SphereGeometry(.3,12,10),M({color:'#ffffff'})); ball.position.set(c.x+1,.3,c.z+.5); root.add(ball); } break;
    case 'cafe_deck_': break;
    case 'path': plane(c.sx,c.sz,mats.path,c.x,0.06,c.z); break;
    case 'flagpole': { cyl(.12,.16,22,mats.steel,c.x,11,c.z,10); cyl(1.2,1.4,.5,mats.pave,c.x,.25,c.z,16);
      const fl=new THREE.Mesh(new THREE.PlaneGeometry(9,4.5),new THREE.MeshStandardMaterial({map:flagTex(),side:THREE.DoubleSide,roughness:.8}));
      fl.position.set(c.x+4.6,19.2,c.z); fl.castShadow=true; root.add(fl); } break;
    default: break;
  }
  root = ROOT0;
}
// perimeter fence (road side + ends solid, beach side low timber) with gate openings
function fenceRun(x1,z1,x2,z2,h,mat){ const len=Math.hypot(x2-x1,z2-z1); if(len<.5) return; const m=box(len,h,.15,mat,(x1+x2)/2,h/2,(z1+z2)/2,true); m.rotation.y=-Math.atan2(z2-z1,x2-x1); }
function edge(side){ // side: 'road'|'beach' along model Y at X=0 or X=W
  const X = side==='road'?0:W; const gs=SCENE.gates.filter(g=>g[0]===X && g[3]==='v').map(g=>[g[1],g[1]+g[2]]).sort((a,b)=>a[0]-b[0]);
  let cur=0; const h= side==='road'?2.4:1.1, mat= side==='road'?mats.fence:mats.timberDark;
  for(const [a,b] of gs){ const [x1,z1]=P(X,cur), [x2,z2]=P(X,a); fenceRun(x1,z1,x2,z2,h,mat); cur=b; }
  const [x1,z1]=P(X,cur), [x2,z2]=P(X,L); fenceRun(x1,z1,x2,z2,h,mat); }
function fencePoly(pts, gates, sea){ for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; const len=Math.hypot(b[0]-a[0],b[1]-a[1]);
    const h = sea[i] ? 1.1 : 2.4, mat = sea[i] ? mats.timberDark : mats.fence; const n=Math.max(1,Math.ceil(len)); let run=null;
    const at=t=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
    for(let k=0;k<n;k++){ const t0=k/n,t1=(k+1)/n; const [mx,mz]=at((t0+t1)/2); const open=gates.some(g=>Math.hypot(g[0]-mx,g[1]-mz)<g[2]/2);
      if(!open){ if(run===null) run=t0; } else if(run!==null){ const p=at(run), q=at(t0); fenceRun(p[0],p[1],q[0],q[1],h,mat); run=null; } }
    if(run!==null){ const p=at(run); fenceRun(p[0],p[1],b[0],b[1],h,mat); } } }
fencePoly(SCENE.fence, SCENE.gates3, SCENE.fenceSea);
for(const e of E.filter(e=>e.kind==='spine'&&!e.poly3)) inGroup(e,c=>{ const long=c.sx>c.sz, len=long?c.sx:c.sz, wd=long?c.sz:c.sx;
  for(let t=-len/2+4;t<len/2;t+=8){ if(long) stringLights(t,-wd/2,t,wd/2,4.4,10); else stringLights(-wd/2,t,wd/2,t,4.4,10); }
  for(let i=0;i<len*1.2;i++){ const u=(rnd()-.5)*len, v=(rnd()-.5)*(wd-1); person(long?u:v, long?v:u); } });
for(const e of E.filter(e=>(e.kind==='lane'||e.kind==='boardwalk')&&!e.poly3)) inGroup(e,c=>{ const long=c.sx>c.sz, len=long?c.sx:c.sz, wd=long?c.sz:c.sx;
  for(let t=-len/2+6;t<len/2;t+=16) lampPost(long?t:-wd/2+.4, long?-wd/2+.4:t);
  for(let i=0;i<len*.3;i++){ const u=(rnd()-.5)*len, v=(rnd()-.5)*(wd-1); person(long?u:v, long?v:u); } });
for(const e of E.filter(e=>(e.kind==='plaza'||e.kind==='funzone')&&!e.poly3)) inGroup(e,c=>{ const n=c.sx*c.sz/14; for(let i=0;i<n;i++) person((rnd()-.5)*(c.sx-2),(rnd()-.5)*(c.sz-2)); });
for(const e of E.filter(e=>(e.kind==='audience'||e.kind==='funzone')&&e.poly3)){ const P=e.poly3; const xs=P.map(p=>p[0]), zs=P.map(p=>p[1]); const x0=Math.min(...xs),x1=Math.max(...xs),z0=Math.min(...zs),z1=Math.max(...zs);
  const dens = e.kind==='funzone' ? 40 : 5;
  for(let i=0;i<(x1-x0)*(z1-z0)/dens;i++){ const x=x0+rnd()*(x1-x0), z=z0+rnd()*(z1-z0); if(pip(x,z,P)) person(x,z); } }
// beach strollers
if(!SCENE.ground) for(let i=0;i<120;i++) person((rnd()-.5)*L*1.2, W/2+4+rnd()*20);

// ---------------------------------------------------------------- lighting presets
const hemi = new THREE.HemisphereLight('#cfe8ff','#d8c39b',.6); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff2d6',2.2); sun.castShadow=true; sun.shadow.mapSize.set(4096,4096);
const S = Math.max(W,L)*0.75; Object.assign(sun.shadow.camera,{left:-S,right:S,top:S,bottom:-S,near:10,far:1200}); sun.shadow.bias=-0.0004; scene.add(sun); scene.add(sun.target);
function setTime(t){
  const sky = {day:['#3d8fc6','#cfe9f7'], dusk:['#3d5a80','#f6bd60'], night:['#0b132b','#1c2541']}[t];
  scene.background = canvasTex(4,256,(g,w,h)=>{ const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,sky[0]); gr.addColorStop(1,sky[1]); g.fillStyle=gr; g.fillRect(0,0,w,h); });
  scene.fog = new THREE.Fog(sky[1], 700, 2600);
  if(t==='day'){ sun.color.set('#fff1d0'); sun.intensity=1.35; sun.position.set(-220,300,280); hemi.intensity=.42; renderer.toneMappingExposure=.82; }
  if(t==='dusk'){ sun.color.set('#ff9e57'); sun.intensity=1.0; sun.position.set(-420,70,-160); hemi.intensity=.38; renderer.toneMappingExposure=.95; }
  if(t==='night'){ sun.color.set('#8fa8d6'); sun.intensity=.18; sun.position.set(200,300,200); hemi.intensity=.12; renderer.toneMappingExposure=1.25; }
  const glow = t==='day'?0:(t==='dusk'?.6:1);
  lights.forEach(l=>l.intensity = glow*2.2);
  mats.glowWarm.color.set(t==='day'?'#f2dfb8':'#ffd38a'); mats.glowTent.color.set(t==='day'?'#2a1d16':'#b8561a');
  towers.forEach(tw=>{ tw.material.emissiveIntensity = glow*.9; });
  sun.target.position.set(0,0,0);
}
const VIEWS = Object.fromEntries(Object.entries(SCENE.views).map(([k,v])=>[k,()=>v]));

setTime(qs.get('t')||'dusk'); setView(qs.get('view')||'aerial');
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
(function loop(){ controls.update(); renderer.render(scene,camera); requestAnimationFrame(loop); })();
window.camAt = (p, tg) => { camera.position.set(p[0],p[1],p[2]); controls.target.set(tg[0],tg[1],tg[2]); camera.lookAt(tg[0],tg[1],tg[2]); renderer.render(scene, camera); return true; };
window.SCENE_DIMS = {W, L};
window.__ready = true; if(!SCENE.ground) window.__groundReady = true;
